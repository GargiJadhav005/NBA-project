version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sar_admin
      POSTGRES_PASSWORD: sar_password
      POSTGRES_DB: sar_faculty_system
    ports:
      - "5432:5432"
    volumes:
      - sar_pg_data:/var/lib/postgresql/data

volumes:
  sar_pg_data:
